name: Gráfico 3D de contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # v0.9.3 — https://github.com/yoshi389111/github-profile-3d-contrib/releases/tag/v0.9.3
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/workflows/3d-contrib-settings.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A profile-3d-contrib
          git commit -m "chore(ci): atualiza gráfico 3D de contribuições" || exit 0
          git push
